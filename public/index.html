<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>imghost</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>Folders <button id="new-folder-btn" title="New folder">+</button></h2>
      <div id="folder-tree"></div>
      <div class="sidebar-footer">
        <button id="logout-btn">Log out</button>
      </div>
    </aside>
    <main class="main">
      <div class="main-header">
        <h1 id="current-folder-label">All images</h1>
      </div>
      <div class="dropzone" id="dropzone">
        Drag &amp; drop an image here, or
        <button id="pick-file-btn">choose a file</button>
        <input type="file" id="file-input" accept="image/*" />
        <div class="dropzone-hint">JPG, PNG, GIF, WebP, AVIF — up to 10MB</div>
      </div>
      <div class="image-grid" id="image-grid"></div>
      <div class="empty-state" id="empty-state" style="display:none;">No images in this folder yet.</div>
    </main>
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-message" id="modal-message"></div>
      <input type="text" id="modal-input" hidden />
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm" class="primary">OK</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
